; PlatformIO project for the ESP32 firmware.
; Open this folder (firmware/scorpion_esp32) in VS Code with PlatformIO.
; src_dir/include_dir = . keeps the Arduino IDE layout working too.

[platformio]
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
lib_deps = madhephaestus/ESP32Servo
